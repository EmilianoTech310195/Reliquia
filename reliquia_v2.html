<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RELIQUIA v2 — Phaser (flat)</title>
<style>
  html,body{margin:0;height:100%;background:#0d160d;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:monospace;}
  #hint{position:fixed;top:6px;left:0;right:0;text-align:center;color:#8bac0f;font-size:12px;z-index:10;pointer-events:none;}
</style>
</head>
<body>
<div id="hint">RELIQUIA v2 (Phaser · estilo flat) — mover con WASD / flechas</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const OUT=0x1b1320; const MAP_W=30*32, MAP_H=20*32;
// ---- helpers de dibujo flat (relleno plano + contorno) sobre Phaser.Graphics ----
function fc(g,x,y,r,c){g.fillStyle(c,1);g.fillCircle(x,y,r);g.lineStyle(3,OUT,1);g.strokeCircle(x,y,r);}
function fcN(g,x,y,r,c){g.fillStyle(c,1);g.fillCircle(x,y,r);} // sin contorno (luz/detalle)
function frr(g,x,y,w,h,r,c){g.fillStyle(c,1);g.fillRoundedRect(x,y,w,h,r);g.lineStyle(3,OUT,1);g.strokeRoundedRect(x,y,w,h,r);}
function frect(g,x,y,w,h,c){g.fillStyle(c,1);g.fillRect(x,y,w,h);g.lineStyle(3,OUT,1);g.strokeRect(x,y,w,h);}
function fel(g,x,y,rx,ry,c){g.fillStyle(c,1);g.fillEllipse(x,y,rx*2,ry*2);g.lineStyle(3,OUT,1);g.strokeEllipse(x,y,rx*2,ry*2);}
function felN(g,x,y,rx,ry,c){g.fillStyle(c,1);g.fillEllipse(x,y,rx*2,ry*2);}
function ftr(g,x1,y1,x2,y2,x3,y3,c){g.fillStyle(c,1);g.fillTriangle(x1,y1,x2,y2,x3,y3);g.lineStyle(3,OUT,1);g.strokeTriangle(x1,y1,x2,y2,x3,y3);}
function dot(g,x,y,r,c){g.fillStyle(c,1);g.fillCircle(x,y,r);}
function makeTex(scene,key,w,h,draw){const g=scene.make.graphics({add:false});draw(g);g.generateTexture(key,w,h);g.destroy();}

// ---- héroe (3 vistas) ----
function heroBody(g,cx,cy){
  frr(g,cx-9,cy+26,7,12,2,0x7a6a3a);frr(g,cx+2,cy+26,7,12,2,0x7a6a3a);
  frr(g,cx-10,cy+35,9,6,2,0x3a2a18);frr(g,cx+1,cy+35,9,6,2,0x3a2a18);
  frr(g,cx-12,cy+6,24,22,5,0x8a5a2a);
}
function texHeroDown(scene){makeTex(scene,'hero_down',44,70,g=>{const cx=22,cy=24;
  heroBody(g,cx,cy); frr(g,cx-4,cy+8,8,14,2,0xd8c890); frect(g,cx-12,cy+22,24,4,0x3a2a18);
  fc(g,cx,cy-4,9,0xe8b079); dot(g,cx-3,cy-4,1.8,OUT); dot(g,cx+3,cy-4,1.8,OUT);
  fel(g,cx,cy-9,17,5.5,0x6e4424); frr(g,cx-9,cy-19,18,12,4,0x5a3418);});}
function texHeroUp(scene){makeTex(scene,'hero_up',44,70,g=>{const cx=22,cy=24;
  heroBody(g,cx,cy); frr(g,cx-7,cy+9,14,16,4,0x6a4a2a);
  fc(g,cx,cy-4,9,0x3a2818); fel(g,cx,cy-9,17,5.5,0x6e4424); frr(g,cx-9,cy-19,18,12,4,0x5a3418);});}
function texHeroSide(scene){makeTex(scene,'hero_side',44,70,g=>{const cx=22,cy=24;
  frr(g,cx-5,cy+26,7,12,2,0x7a6a3a); frr(g,cx-6,cy+35,9,6,2,0x3a2a18);
  frr(g,cx-10,cy+9,7,16,3,0x6a4a2a); frr(g,cx-9,cy+6,18,22,5,0x8a5a2a);
  fc(g,cx+2,cy-4,9,0xe8b079); dot(g,cx+5,cy-4,1.8,OUT);
  fel(g,cx+2,cy-9,17,5.5,0x6e4424); frr(g,cx-7,cy-19,18,12,4,0x5a3418);});}

// ---- enemigos ----
function texBaba(scene){makeTex(scene,'baba',40,32,g=>{const x=20,y=16;
  frr(g,x-14,y-4,28,18,9,0x5a9a2e); felN(g,x-3,y-2,9,5,0x76c23e);
  fc(g,x-5,y,4,0xffffff);fc(g,x+5,y,4,0xffffff);dot(g,x-4,y+1,1.8,OUT);dot(g,x+6,y+1,1.8,OUT);});}
function texReptil(scene){makeTex(scene,'reptil',52,32,g=>{const x=26,y=16;
  fel(g,x+14,y,7,4,0x244a16); frr(g,x-14,y-7,26,16,8,0x34602a); felN(g,x-6,y-3,9,4,0x4a8038);
  ftr(g,x-8,y-7,x-5,y-13,x-2,y-7,0x1e3e12);ftr(g,x,y-7,x+3,y-13,x+6,y-7,0x1e3e12);
  fel(g,x-12,y-1,6,5,0x34602a); fc(g,x-12,y-2,2.6,0xd8e0c0);
  ftr(g,x-15,y+3,x-14,y+6,x-13,y+3,0xffffff);ftr(g,x-12,y+3,x-11,y+6,x-10,y+3,0xffffff);});}
function texEspectro(scene){makeTex(scene,'espectro',36,42,g=>{const x=18,y=18;
  g.fillStyle(0xcfe6d2,1);g.beginPath();g.arc(x,y-4,11,Math.PI,0,false);
  g.lineTo(x+11,y+10);g.lineTo(x+6,y+5);g.lineTo(x+2,y+11);g.lineTo(x-2,y+5);g.lineTo(x-6,y+11);g.lineTo(x-11,y+5);g.closePath();g.fillPath();
  g.lineStyle(3,OUT,1);g.strokePath();
  g.fillStyle(OUT,1);g.fillEllipse(x-4,y-4,4.8,6.8);g.fillEllipse(x+4,y-4,4.8,6.8);
  dot(g,x-4,y-5,1,0x7fe8f0);dot(g,x+4,y-5,1,0x7fe8f0);});}
function texMurcielago(scene){makeTex(scene,'murcielago',44,32,g=>{const x=22,y=16;
  ftr(g,x-4,y-2,x-18,y-8,x-12,y+4,0x3a2a4e);ftr(g,x+4,y-2,x+18,y-8,x+12,y+4,0x3a2a4e);
  fc(g,x,y,8,0x241830);
  ftr(g,x-5,y-6,x-7,y-15,x-1,y-8,0x241830);ftr(g,x+5,y-6,x+7,y-15,x+1,y-8,0x241830);
  dot(g,x-3,y-1,1.9,0xff3a4a);dot(g,x+3,y-1,1.9,0xff3a4a);
  ftr(g,x-2,y+4,x-1,y+8,x,y+4,0xffffff);ftr(g,x+2,y+4,x+1,y+8,x,y+4,0xffffff);});}
function texArana(scene){makeTex(scene,'arana',46,38,g=>{const x=23,y=20;
  g.lineStyle(4,OUT,1);
  for(let i=-1;i<2;i++){g.beginPath();g.moveTo(x-6,y+i*5);g.lineTo(x-14,y-4+i*5);g.lineTo(x-17,y+3+i*5);g.strokePath();
    g.beginPath();g.moveTo(x+6,y+i*5);g.lineTo(x+14,y-4+i*5);g.lineTo(x+17,y+3+i*5);g.strokePath();}
  fc(g,x,y+2,10,0x2a1e3a);fc(g,x,y-7,6,0x241636);
  ftr(g,x-3,y-1,x,y+5,x+3,y-1,0xb02a3a);
  dot(g,x-2,y-8,1.6,0xff3a4a);dot(g,x+2,y-8,1.6,0xff3a4a);});}
function texGuardian(scene){makeTex(scene,'guardian',44,44,g=>{const x=22,y=22;
  frr(g,x-16,y-16,32,32,3,0x6e6e60); frr(g,x-13,y-13,26,5,1,0x5a5a50);
  fel(g,x-7,y-2,4,3.5,0x3a3a32);fel(g,x+7,y-2,4,3.5,0x3a3a32);dot(g,x-7,y-2,2,0xffb830);dot(g,x+7,y-2,2,0xffb830);
  ftr(g,x,y-2,x-3,y+5,x+3,y+5,0x52524a);
  for(let i=0;i<4;i++)frect(g,x-7+i*4,y+8,3,5,0xcfcabb);});}
function texBoss(scene){makeTex(scene,'boss',56,52,g=>{const x=28,y=26;
  frr(g,x-18,y-12,36,30,4,0x5e5e54);
  for(let i=-2;i<=2;i++)fc(g,x+i*7,y-16,3.6,0xdcd8c8);
  dot(g,x-8,y-2,3,0xff7a2a);dot(g,x+8,y-2,3,0xff7a2a);
  for(let i=0;i<5;i++)frect(g,x-10+i*4,y+11,3,5,0xcfcabb);});}

function texGrass(scene){makeTex(scene,'grass',32,32,g=>{
  g.fillStyle(0x5cbf4a,1);g.fillRect(0,0,32,32);
  g.fillStyle(0x52b340,1);for(let y=0;y<32;y+=12)for(let x=0;x<32;x+=12)g.fillRect(x,y,6,6);
  g.lineStyle(2,0x2e7a26,1);g.beginPath();g.moveTo(8,22);g.lineTo(6,15);g.moveTo(22,12);g.lineTo(24,6);g.moveTo(16,30);g.lineTo(14,24);g.strokePath();});}
function texTree(scene){makeTex(scene,'tree',44,58,g=>{const x=22;
  frect(g,x-4,36,8,18,0x6e4a28); fc(g,x,26,18,0x2f9a3a); fcN(g,x-5,20,8,0x46b84a);});}

let player, cursors, keys, enemies;
function create(){
  texGrass(this);texTree(this);texHeroDown(this);texHeroUp(this);texHeroSide(this);
  texBaba(this);texReptil(this);texEspectro(this);texMurcielago(this);texArana(this);texGuardian(this);texBoss(this);
  this.add.tileSprite(0,0,MAP_W,MAP_H,'grass').setOrigin(0,0);
  const trees=this.physics.add.staticGroup();
  [[5,3],[9,7],[14,2],[20,5],[24,9],[7,14],[16,16],[26,3],[3,17],[22,15],[12,11],[27,17]]
    .forEach(([tx,ty])=>{const t=trees.create(tx*32+16,ty*32+16,'tree');t.setSize(22,16).setOffset(11,38).refreshBody();t.setDepth(t.y);});
  // jefe como "estatua" de muestra (esquina)
  this.add.image(26*32,5*32,'boss').setDepth(5*32);
  // enemigos variados deambulando
  enemies=this.physics.add.group();
  [['baba',8,5],['reptil',18,8],['espectro',12,12],['murcielago',23,6],['arana',9,16],['baba',20,13]]
    .forEach(([k,tx,ty])=>{const e=enemies.create(tx*32+16,ty*32+16,k);e.setData('t',Math.random()*6);e.setCollideWorldBounds(true);});
  player=this.physics.add.sprite(15*32,10*32,'hero_down');
  player.setSize(20,16).setOffset(12,50).setCollideWorldBounds(true);
  this.physics.add.collider(player,trees); this.physics.add.collider(enemies,trees);
  this.physics.world.setBounds(0,0,MAP_W,MAP_H);
  this.cameras.main.setBounds(0,0,MAP_W,MAP_H); this.cameras.main.startFollow(player,true,0.12,0.12);
  this.cameras.main.setBackgroundColor('#274a1c');
  cursors=this.input.keyboard.createCursorKeys(); keys=this.input.keyboard.addKeys('W,A,S,D');
}
function update(time){
  if(!player)return; const sp=150,b=player.body; let vx=0,vy=0;
  if(cursors.left.isDown||keys.A.isDown)vx=-1; else if(cursors.right.isDown||keys.D.isDown)vx=1;
  if(cursors.up.isDown||keys.W.isDown)vy=-1; else if(cursors.down.isDown||keys.S.isDown)vy=1;
  const len=Math.hypot(vx,vy)||1; b.setVelocity(vx/len*sp,vy/len*sp);
  if(vy<0&&!vx)player.setTexture('hero_up');
  else if(vx)player.setTexture('hero_side').setFlipX(vx<0);
  else player.setTexture('hero_down');
  player.setDepth(player.y);
  enemies.children.iterate(o=>{ if(!o)return; const t=time*0.001+o.getData('t');
    o.body.setVelocity(Math.cos(t)*32,Math.sin(t*1.3)*32); o.setDepth(o.y); });
}
const config={ type:Phaser.AUTO, width:480, height:320, backgroundColor:'#274a1c', pixelArt:false, roundPixels:true,
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}, physics:{default:'arcade',arcade:{debug:false}},
  scene:{ create, update } };
new Phaser.Game(config);
</script>
</body>
</html>
